# configs/storage.yaml
# Storage layer configuration

sqlite:
  path: "data/finance.db"

chroma:
  path: "data/chroma"
  collection_name: "tracealchemy_docs"
  embedding_dimension: 2560   # TraceAlchemy embedding output dimension (informational)

embedding:
  provider: "llama-server"
  endpoint: "http://127.0.0.1:8087/v1/embeddings"
  model: "tracealchemy"
  pooling: "mean"
  batch_size: 10

cache:
  default_ttl_hours: 24
  filing_ttl_hours: 168
  earnings_ttl_hours: 336

# Document chunking (Phase 2.1.3). "structural" splits on SEC section markers /
# markdown headings and packs sentences up to max_chars (no mid-sentence cuts,
# sentence-based overlap). "fixed" reproduces the legacy ~max_chars sliding
# window with char overlap.
chunking:
  strategy: "structural"      # structural | fixed
  max_chars: 1000
  overlap_sentences: 1        # structural: sentences carried into the next chunk
  fixed_overlap_chars: 150    # fixed: char overlap (legacy DEFAULT_CHUNK_OVERLAP)

sec:
  # SEC EDGAR requires a descriptive User-Agent identifying the requester.
  # Resolution order in SECEdgarFilingFetcher: constructor param >
  # SEC_EDGAR_USER_AGENT env var > this config default.
  user_agent: "TraceAlchemy Research contact@tracealchemy.example.com"
