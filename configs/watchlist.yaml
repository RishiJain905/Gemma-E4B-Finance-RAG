# configs/watchlist.yaml
# Security coverage is configured in coverage.yaml. Legacy core/extended
# watchlists remain readable for one compatibility release.

# Deprecated compatibility mirror. CoverageResolver does not use these when
# coverage.yaml is present.
core: [NVDA, AMD, AAPL, MSFT, META, CRWD]
extended: [GOOGL, AMZN, TSLA, AVGO, ORCL, INTC, QCOM, PANW, PLTR, SNOW]

# Macro indicators fetched as market proxies, not as company securities.
macro_tickers:
  - SPY    # S&P 500 ETF (market proxy)
  - QQQ    # Nasdaq ETF (tech proxy)
  - TLT    # Long-term treasuries (rates proxy)
  - GLD    # Gold (inflation/hedge proxy)

# Ingestion schedule (hours)
schedule:
  fundamentals: 24
  news: 6
  finnhub_news: 6
  massive_market: 24
  massive_actions: 24
  macro: 24
  sec_filings: 12
  sec_companyfacts: 24
  gdelt_news: 6
  transcripts: 168
  ir_pages: 24
  estimates: 24
