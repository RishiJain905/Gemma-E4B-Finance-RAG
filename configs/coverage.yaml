# configs/coverage.yaml
# Source-aware security coverage policy. This file contains no provider credentials.
revision: "2.3.2.3-r3"
fallback_when_registry_empty: deep

# 2026-07-20 watchlist refresh (user-directed): deep coverage is the active
# tech watchlist (full filing text, transcripts, IR, estimates, GDELT);
# former deep/broad members not in the new list stay in broad so their
# already-ingested evidence keeps being maintained.

deep:
  tickers: [SNDK, PLTR, NVDA, MU, INTC, NBIS, BB, AMD,
            AAPL, MSFT, GOOGL, AMZN, META, TSLA, AVGO, ORCL]
  # Off-index opt-in for the full deep set (matches the original policy's
  # pattern): inert for any ticker the universe snapshots record as an index
  # member, and prevents hard validation failures for genuinely off-index
  # names (SNDK post-spinoff, NBIS, BB) or partial registries.
  allow_outside_indexes: [SNDK, PLTR, NVDA, MU, INTC, NBIS, BB, AMD,
                          AAPL, MSFT, GOOGL, AMZN, META, TSLA, AVGO, ORCL]

broad:
  additions: [CRWD, QCOM, PANW, SNOW, CRM, NFLX, ADBE, TXN, SMCI, DELL]

sector:
  rules:
    health_care: [Health Care, Healthcare]
    automotive: [Consumer Discretionary, Automotive]
    government_contractors: [Industrials, Aerospace & Defense]

sources:
  universe_ivv:
    enabled: true
    scopes: [universe]
    capabilities: [index_membership]
  universe_nasdaq100:
    enabled: true
    scopes: [universe]
    capabilities: [index_membership]
  universe_sec:
    enabled: true
    scopes: [universe]
    capabilities: [security_identity]

  yfinance:
    enabled: true
    scopes: [broad]
    capabilities: [market_summary, company_news]
  yfinance_fundamentals:
    enabled: true
    scopes: [broad]
    capabilities: [market_summary]
  yfinance_news:
    enabled: true
    scopes: [broad]
    capabilities: [company_news]
  finnhub:
    enabled: true
    optional: true
    required_env: FINNHUB_API_KEY
    scopes: [broad]
    capabilities: [company_news]
  massive:
    enabled: true
    optional: true
    required_env: MASSIVE_API_KEY
    scopes: [broad]
    capabilities: [market_summary, corporate_actions, company_news, vendor_filing_metadata]
  massive_news:
    enabled: true
    optional: true
    required_env: MASSIVE_API_KEY
    scopes: [broad]
    capabilities: [company_news]
  twelve_data:
    enabled: false
    optional: true
    required_env: TWELVE_DATA_API_KEY
    scopes: [broad]
    capabilities: [market_summary]
  sec_filings:
    enabled: true
    scopes: [broad]
    capabilities: [sec_event_discovery]
  sec_filing_text:
    enabled: true
    scopes: [deep]
    capabilities: [full_filing_text]
  sec_companyfacts:
    enabled: true
    scopes: [deep]
    capabilities: [sec_companyfacts]
  earnings_transcripts:
    enabled: true
    scopes: [deep]
    capabilities: [earnings_transcripts]
  ir_pages:
    enabled: true
    scopes: [deep]
    capabilities: [investor_relations]
  estimates:
    enabled: true
    scopes: [deep]
    capabilities: [analyst_estimates]
  gdelt:
    enabled: true
    optional: true
    scopes: [deep]
    capabilities: [gdelt_news]
  fred:
    enabled: true
    scopes: [global]
    capabilities: [official_macro]

  federal_reserve:
    enabled: true
    scopes: [global]
    capabilities: [official_policy, official_releases]
  treasury:
    enabled: true
    scopes: [global]
    capabilities: [official_rates]
  bls:
    enabled: true
    optional: true
    required_env: BLS_API_KEY
    scopes: [global]
    capabilities: [official_labor_statistics]
  bea:
    enabled: true
    optional: true
    required_env: BEA_API_KEY
    scopes: [global]
    capabilities: [official_national_accounts]
  eia:
    enabled: true
    optional: true
    required_env: EIA_API_KEY
    scopes: [global]
    capabilities: [official_energy_statistics]
  ny_fed:
    enabled: true
    scopes: [global]
    capabilities: [official_rates, market_operations]
  cftc:
    enabled: true
    scopes: [global]
    capabilities: [official_positioning]

  openfda:
    enabled: true
    optional: true
    required_env: OPENFDA_API_KEY
    scopes: [sector]
    sector_rules: [health_care]
    capabilities: [regulatory_events]
  nhtsa:
    enabled: true
    scopes: [sector]
    sector_rules: [automotive]
    capabilities: [vehicle_safety_events]
  usaspending:
    enabled: true
    scopes: [sector]
    sector_rules: [government_contractors]
    capabilities: [government_awards]
