# Curated first-party datasets and releases for Phase 2.3.2.3.
# Only entries in this file may be requested by the official adapters.
version: "2.3.2.3-r1"

# Catalog entries remain documented/queryable while rollout is disabled.
feature_flags:
  official_feeds: false
  sector_feeds: false

entries:
  - name: federal_reserve_policy_statements
    agency: federal_reserve
    dataset_id: federal-reserve-rss-policy-statements
    unit: document
    frequency: per_release
    expected_cadence: event_driven
    source_category: official_release
    sectors: [global]
    payload_type: narrative
    endpoint: https://www.federalreserve.gov/feeds/press_monetary.xml
    category: fomc statement
  - name: federal_reserve_minutes
    agency: federal_reserve
    dataset_id: federal-reserve-rss-minutes
    unit: document
    frequency: per_release
    expected_cadence: meeting_cycle
    source_category: official_release
    sectors: [global]
    payload_type: narrative
    endpoint: https://www.federalreserve.gov/feeds/press_monetary.xml
    category: minutes
  - name: federal_reserve_speeches
    agency: federal_reserve
    dataset_id: federal-reserve-rss-speeches
    unit: document
    frequency: per_release
    expected_cadence: event_driven
    source_category: official_release
    sectors: [global]
    payload_type: narrative
    endpoint: https://www.federalreserve.gov/feeds/speeches.xml
    category: speech
  - name: federal_reserve_regulation
    agency: federal_reserve
    dataset_id: federal-reserve-rss-regulation
    unit: document
    frequency: per_release
    expected_cadence: event_driven
    source_category: official_regulatory
    sectors: [financials]
    payload_type: narrative
    endpoint: https://www.federalreserve.gov/feeds/press_bcreg.xml
    category: regulat
  - name: federal_reserve_statistical_releases
    agency: federal_reserve
    dataset_id: federal-reserve-rss-statistical-releases
    unit: document
    frequency: per_release
    expected_cadence: scheduled_release
    source_category: official_release
    sectors: [global]
    payload_type: narrative
    endpoint: https://www.federalreserve.gov/feeds/datadownload.xml
    category: ""
    max_items: 50

  - name: treasury_nominal_yield_10y
    agency: treasury
    dataset_id: treasury-nominal-yield-curve
    unit: percent
    frequency: daily
    expected_cadence: business_daily
    source_category: official_macro
    sectors: [global]
    payload_type: structured
    endpoint: https://home.treasury.gov/sites/default/files/interest-rates/yield.xml
    field: BC_10YEAR
    series_id: DGS10
  - name: treasury_real_yield_10y
    agency: treasury
    dataset_id: treasury-real-yield-curve
    unit: percent
    frequency: daily
    expected_cadence: business_daily
    source_category: official_macro
    sectors: [global]
    payload_type: structured
    endpoint: https://home.treasury.gov/sites/default/files/interest-rates/real_yield.xml
    field: TC_10YEAR
    field_aliases: [REAL_10YEAR]
    series_id: DFII10
  - name: treasury_bill_rate_4w
    agency: treasury
    dataset_id: treasury-bill-rates
    unit: percent
    frequency: daily
    expected_cadence: business_daily
    source_category: official_macro
    sectors: [global]
    payload_type: structured
    endpoint: https://home.treasury.gov/sites/default/files/interest-rates/daily_treas_bill_rates.xml
    field: CS_4WK_YIELD_AVG
    field_aliases: [BILL_4WEEK]
    series_id: DTB4WK

