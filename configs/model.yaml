# configs/model.yaml
# TraceAlchemy Model Configuration — Windows + AMD RDNA3
# Inference runs on Windows PC with AMD GPU.
# The Hermes agent operates on Linux; model is served remotely.

model:
  name: "TraceAlchemy-Gemma-4-E4B-Finance-IT"
  id: "tracealchemy"
  backend: "llama-server"

  # ── Network ──────────────────────────────────────────
  host: "127.0.0.1"
  port: 8087
  base_url: "http://127.0.0.1:8087"
  platform: "windows"

  # ── Architecture ─────────────────────────────────────
  family: "Gemma 4 E4B"
  architecture: "Mixture-of-Experts (MoE)"
  parameters_total: "~9B"
  parameters_active: "~2.6B"
  quantization: "Q8_0"

  # ── GPU ──────────────────────────────────────────────
  gpu_vendor: "AMD"
  gpu_arch: "RDNA3 (gfx1101)"
  gpu_layers: 99
  gpu_memory: 16  # GB, adjust based on your actual VRAM

  # ── Context & Limits ─────────────────────────────────
  max_context: 131072
  max_tokens_default: 2048
  max_tokens_max: 8192
  supported_modes:
    - chat
    - completion
    - embedding

  # ── Speculative Decoding (MTP) ──────────────────────
  speculative_decoding:
    enabled: true
    type: "mtp"                               # Multi-Token Prediction
    draft_model: "gemma-4-E4B-it-assistant"
    draft_model_path: "D:\\LOCAL-MODELS\\AtomicChat\\gemma-4-E4B-it-assistant-GGUF\\gemma-4-E4B-it-assistant.F16.gguf"
    draft_block_size: 3
    draft_quant: "F16"

  # ── Cache ────────────────────────────────────────────
  cache:
    type_key: "q8_0"
    type_value: "turbo4"

  # ── CPU ──────────────────────────────────────────────
  cpu_threads: 8

  # ── API Endpoints ────────────────────────────────────
  endpoints:
    chat_completions: "/v1/chat/completions"
    completions: "/v1/completions"
    embeddings: "/v1/embeddings"

  # ── Default Sampling ─────────────────────────────────
  defaults:
    temperature: 0.7
    top_p: 0.95
    top_k: 40
    repeat_penalty: 1.1

  # ── Per-Task Parameters ──────────────────────────────
  tasks:
    fact_extraction:
      description: "Parsing SEC filings into structured data"
      temperature: 0.1
      max_tokens: 1024
    general_qa:
      description: "Answering user queries with RAG context"
      temperature: 0.7
      max_tokens: 512
    analysis:
      description: "Deep financial analysis and reasoning"
      temperature: 0.5
      max_tokens: 2048

  # ── Embedding ────────────────────────────────────────
  embedding:
    enabled: true
    endpoint: "http://127.0.0.1:8087/v1/embeddings"
    dimension: 0    # Fill after Task 1.1.7
    normalize: true
    batch_supported: true
    pooling: "mean"

  # ── Model Paths (Windows) ────────────────────────────
  paths:
    main_model: "D:\\LOCAL-MODELS\\trjxter\\TraceAlchemy-Gemma-4-E4B-Finance-IT-gguf\\gemma-4-E4B-it.Q8_0.gguf"
    build_dir: "F:\\Personal\\TQ-Optimizer-Test\\atomic-llama-cpp-turboquant\\build-rdna3-gfx1101"
    binary: "bin\\llama-server.exe"
