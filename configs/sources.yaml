# configs/sources.yaml
# Scheduler-owned source cadence, cursor, quota, and bounded-work registry.
version: "2.3.4.1-r1"

# Phase 2.3 capability rollout gates. These are intentionally independent of
# per-source definitions so schema/config can ship before network work starts.
# Disabling a capability never removes previously stored evidence.
feature_flags:
  sec_broad_events: true
  company_news: true
  grouped_market_data: true
  official_feeds: true
  sector_feeds: true

# Explicit bootstrap windows. These values are never consulted by daily or
# hourly incremental runs.
bootstrap:
  sec_lookback_days: 30
  company_news_days: 30
  market_history_days: 30
  macro_history_observations: 5
  max_sec_partitions: 90
  max_run_summaries: 100

sources:
  universe_nasdaq100:
    capability_group: universe
    enabled: true
    scope: universe
    cadence: daily
    run_modes: [daily, all]
    priority: 10
    dependencies: []
    cursor_kind: timestamp
    overlap: null
    requests_per_minute: 10
    requests_per_day: 100
    requests_per_run: 1
    batch_size: 1
    max_work_items_per_run: 1
    retry_policy: public_snapshot
    ttl_key: universe_nasdaq100
    ttl_hours: 24

  universe_ivv:
    capability_group: universe
