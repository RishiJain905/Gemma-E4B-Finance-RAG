# configs/gdelt.yaml
# GDELT news configuration

# GDELT 2.0 query parameters
max_records: 250          # Max articles per query (GDELT limit)
lookback_days: 7          # How far back to search on initial run
# Shared DOC API throttle is ~1 req / 5s; keep a cushion so deep daily runs
# (domain-scoped query + optional bare fallback + GKG) do not 429 immediately.
request_delay: 7.0
max_retries_on_429: 4     # Retries after 429 with exponential backoff (delay * 2^n)
# Prefer the primary company-name term; aliases multiply DOC calls and trip 429s.
max_query_terms_per_ticker: 1
gkg_max_files_per_fetch: 24   # Max GKG 15-min CSV files per enrichment pass
use_title_tone_fallback: true  # Lexicon fallback when GKG URL match missing

# Domain filters — restrict to financial news sources (GDELT query length limit)
max_finance_domains: 5     # Cap OR-clause size; full list is too long for DOC API
finance_domains:
  - reuters.com
  - bloomberg.com
  - cnbc.com
  - marketwatch.com
  - seekingalpha.com
  - finance.yahoo.com
  - wsj.com
  - ft.com
  - investing.com
  - barrons.com
  - economist.com
  - nytimes.com

# Topic filters (GDELT GCAM codes)
# See: http://data.gdeltproject.org/api/v2/guides/GCAM-MASTER.txt
financial_topics:
  - "FINANCE"            # General financial news
  - "MARKETS"            # Market movements
  - "ECON_MACRO"         # Macroeconomic indicators
  - "ECON_INDICATOR"     # Specific economic data releases
  - "CORPORATE"          # Corporate news (earnings, M&A)
  - "REGULATION"         # Regulatory actions
  - "TRADE"              # Trade policy
