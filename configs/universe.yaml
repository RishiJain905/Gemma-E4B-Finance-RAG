# Security universe provider configuration (Phase 2.3.1.1).
# Additive rollout gate. Stored identities remain queryable while disabled.
feature_flags:
  universe_refresh: true

providers:
  nasdaq100:
    enabled: true
    source: nasdaq
    index_code: nasdaq100
    url: https://api.nasdaq.com/api/quote/list-type/nasdaq100
    min_constituents: 90
    timeout_seconds: 30
  sp500:
    enabled: true
    source: ivv
    index_code: sp500
    url: https://www.blackrock.com/varnish-api/blk-one01-product-data/product-data/api/v1/get-fund-document?appType=PRODUCT_PAGE&appSubType=ISHARES&targetSite=us-ishares&locale=en_US&portfolioId=239726&component=holdings&userType=individual
    min_constituents: 450
    timeout_seconds: 30
  sec_identity:
    enabled: true
    source: sec
    url: https://www.sec.gov/files/company_tickers_exchange.json
    min_records: 1000
    timeout_seconds: 30
