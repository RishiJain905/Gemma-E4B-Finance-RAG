[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
    -p no:cacheprovider
markers =
    live: tests requiring SEC EDGAR network and llama-server on :8087
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests that need external services
    regression: marks regression tests for prior phases
    e2e: marks end-to-end pipeline tests
    network: marks tests that make network calls
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
